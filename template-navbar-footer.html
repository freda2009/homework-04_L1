<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六角｜2026軟體工程師體驗營作業-Nelson- header - footer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Castoro:ital@0;1&family=Noto+Sans+TC:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,dehaze,drafts,keyboard_arrow_down,keyboard_arrow_left,keyboard_arrow_right,keyboard_arrow_up,share,visibility,web" />

  <link rel="stylesheet" href="css/header-footer.css">
 
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header  class="sticky-top"> 
    <nav class="navbar navbar-expand-md  ">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand logo" href="/" aria-label="Nelson LOGO"></a>

      <!-- Mobile: hamburger → offcanvas -->
        <button class="navbar-toggler d-md-none" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
          aria-controls="mobileMenu" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Desktop: inline nav -->
        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav gap-1 align-items-center">
            <li class="nav-item"><a class="nav-link" href="service.html">服務項目</a></li>
            <li class="nav-item"><a class="nav-link" href="project.html">專案作品</a></li>
            <li class="nav-item"><a class="nav-link" href="blog.html">部落格</a></li>
            <li class="nav-item"><a class="nav-link" href="#contact">與我聯絡</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===== MOBILE OFFCANVAS MENU ===== -->
  <div class="offcanvas offcanvas-end d-md-none" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
    <div class="offcanvas-header">
      <span class="offcanvas-title" id="mobileMenuLabel">Nelson</span>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">服務項目</a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">專案作品</a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">部落格</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact" data-bs-dismiss="offcanvas">與我聯絡</a></li>
      </ul>
    </div>
  </div>

  <!-- Page content placeholder -->
  <div class="page-spacer">頁面內容區域</div>

  <!-- ===== FOOTER / CONTACT ===== -->
  <footer id="contact" class="contact-section">
    <div class="container">
      <div class="row g-4 align-items-stretch">

        <!-- 左欄：文字 + 社群（用 flex 推到底部） -->
        <div class="col-md-5">
          <div class="contact-left">
            <div class="contact-top">
              <p class="contact-label">與我聯絡</p>
              <h2 class="contact-title">CONTACT</h2>
              <p class="contact-desc">
                若有數位產品設計和開發相關問題<br>
                歡迎填寫表單 或 直接與我聯絡！
              </p>
            </div>
            <!-- 桌面版社群（flex 推到底部） -->
            <div class="contact-social d-none d-md-block">
              <div class="social-icons">
                <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="#" aria-label="LINE"><i class="bi bi-line"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
              </div>
              <p class="contact-email">
                <span class="material-symbols-outlined">drafts</span>
                <a class="contact-email-link" href="mailto:service@hexschool.com">service@hexschool.com</a>
              </p>
            </div>
          </div>
        </div>

        <!-- 右欄：表單 -->
        <div class="col-md-7">
          <div class="contact-form">
            <div class="row g-3">
              <div class="col-sm-6">
                <input type="text" class="form-control" placeholder="姓名">
              </div>
              <div class="col-sm-6">
                <input type="tel" class="form-control" placeholder="手機號碼">
              </div>
              <div class="col-12">
                <input type="email" class="form-control" placeholder="電子信箱">
              </div>
              <div class="col-12">
                <textarea class="form-control" placeholder="備註"></textarea>
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-submit">送出</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 手機版社群（排在表單下方） -->
        <div class="col-12 d-md-none">
          <div class="social-icons">
            <a href="#" aria-label="Instagram" target="_blank"><i class="bi bi-instagram"></i></a>
            <a href="#" aria-label="LINE" target="_blank"><i class="bi bi-line"></i></a>
            <a href="#" aria-label="LinkedIn" target="_blank"><i class="bi bi-linkedin"></i></a>
          </div>
          <p class="contact-email">
            <span class="material-symbols-outlined">drafts</span>
            <a class="contact-email-link" href="mailto:service@hexschool.com">service@hexschool.com</a>
          </p>
        </div>

      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
